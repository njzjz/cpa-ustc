name: test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  desktop:
    uses: ./.github/workflows/native-desktop.yml
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      EXPECTED_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
      - run: |
          test "$(go env GOARCH)" = "$EXPECTED_ARCH"
          make test check build
      - run: python3 tests/native_abi_smoke.py
      - run: python3 -m unittest discover -s tests -p 'test_package_release.py' -v
      - name: Validate real native release archives before tagging
        run: python3 scripts/package_release.py --tag "v$(dist/cpa-ustc version | cut -d' ' -f2)" --goos linux --goarch "$EXPECTED_ARCH"
      - name: Build pinned reference CPA host
        run: |
          host="$RUNNER_TEMP/cpa-host"
          git init --quiet "$host"
          git -C "$host" fetch --quiet --depth 1 https://github.com/router-for-me/CLIProxyAPI.git f7331b5197730226829cab32c31fb4ce546ef8fc
          git -C "$host" checkout --quiet --detach FETCH_HEAD
          (cd "$host" && go build -trimpath -o "$host/cli-proxy-api" ./cmd/server)
          echo "CPA_USTC_HOST_BINARY=$host/cli-proxy-api" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare isolated browser tests
        run: |
          npm install --prefix "$RUNNER_TEMP/cpa-browser" playwright@1.61.1 --no-audit --no-fund
          "$RUNNER_TEMP/cpa-browser/node_modules/.bin/playwright" install --with-deps chromium
          echo "CPA_USTC_PLAYWRIGHT_MODULE=$RUNNER_TEMP/cpa-browser/node_modules/playwright" >> "$GITHUB_ENV"
      - run: python3 tests/native_smoke.py
