name: release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to build without moving the tag
        required: true
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  desktop:
    uses: ./.github/workflows/native-desktop.yml
    with:
      release_tag: ${{ inputs.release_tag || github.ref_name }}
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    container: golang:1.26-bookworm
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - name: Install packaging and smoke test tools
        run: apt-get update && apt-get install -y --no-install-recommends python3 zip openssl
      - name: Test and build
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(go env GOARCH)" = "$EXPECTED_ARCH"
          make test check build
      - name: Build pinned reference CPA host
        run: |
          set -euo pipefail
          host="$RUNNER_TEMP/cpa-host"
          git init --quiet "$host"
          git -C "$host" fetch --quiet --depth 1 https://github.com/router-for-me/CLIProxyAPI.git f7331b5197730226829cab32c31fb4ce546ef8fc
          git -C "$host" checkout --quiet --detach FETCH_HEAD
          (cd "$host" && go build -trimpath -o "$host/cli-proxy-api" ./cmd/server)
          echo "CPA_USTC_HOST_BINARY=$host/cli-proxy-api" >> "$GITHUB_ENV"
      - name: Check native ABI
        run: |
          python3 tests/native_abi_smoke.py
          python3 tests/native_smoke.py
          python3 -m unittest discover -s tests -p 'test_package_release.py' -v
      - name: Package and verify release version
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          RELEASE_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          python3 scripts/package_release.py --tag "$RELEASE_TAG" --goos linux --goarch "$RELEASE_ARCH"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*.zip
          if-no-files-found: error

  publish:
    needs: [build, desktop]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate and verify checksums
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          python3 scripts/package_release.py --tag "$RELEASE_TAG" --verify-all
          cd dist
          sha256sum --check checksums.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" dist/*.zip dist/checksums.txt \
            --verify-tag --title "USTC Token Plan $RELEASE_TAG" --notes-file docs/release-notes.md
